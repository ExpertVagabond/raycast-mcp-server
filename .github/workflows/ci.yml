name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18, 20]
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run lint
      run: npm run lint --if-present
    
    - name: Run type check
      run: npm run type-check --if-present
    
    - name: Run tests
      run: npm test --if-present
    
    - name: Run build
      run: npm run build --if-present

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v7

    - name: Run security audit
      run: npm audit --audit-level moderate

    # analyze cannot run on its own -- it reads a config that only init writes,
    # and it failed with "Has the 'init' action been called?" every time it was
    # reached. It also took a `languages` input, which belongs on init and was
    # being ignored ("Unexpected input(s) 'languages'"). This was invisible
    # until the audit step above started passing.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.37.9
      with:
        languages: javascript-typescript

    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@v4.37.9

  release:
    needs: [ci, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build
      run: npm run build --if-present
    
    # semantic-release publishes to npm by default, so with no NPM_TOKEN it
    # fails on every push to main. Skip the release instead of going red.
    - name: Check release credentials
      id: creds
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        if [ -n "$NPM_TOKEN" ]; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        else
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Release skipped::NPM_TOKEN is not set on this repository, so semantic-release cannot publish. Add the secret to re-enable releases."
        fi

    # semantic_version was pinned to 18; current @semantic-release/* plugins
    # declare a peer on v22+, so installing extra_plugins failed outright.
    - name: Semantic Release
      if: steps.creds.outputs.ready == 'true'
      uses: cycjimmy/semantic-release-action@v6
      with:
        semantic_version: 24
        extra_plugins: |
          @semantic-release/changelog
          @semantic-release/git
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
